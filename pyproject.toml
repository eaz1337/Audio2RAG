[project]
name = "audio2rag"
version = "0.1.0"
description = "Turn recorded meetings, lectures, and training into a queryable knowledge base with timestamp-anchored citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# Local embedding/reranker inference (Standard+) — see CLAUDE.md "Dependencies".
rag = [
    "sentence-transformers>=3.0",
    "lancedb>=0.13",
    "bm25s>=0.2",
]
# Only needed for the whisper-local ASR fallback (ADR 0002) — never required for the
# default hosted backend.
cuda = [
    "faster-whisper>=1.0",
    "torch>=2.2",
]
# Only needed for whisper-local diarization (INGEST-6) — hosted backends return
# speaker labels inline and never need this.
diarize = [
    "pyannote.audio>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pypdf>=4.0",  # test-only: verifies rendered PDF content, never used from src/
    "srt>=3.5",  # test-only: parses/validates rendered SRT content, never used from src/
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installed as top-level package `src` (import src.models.schemas, src.cli, ...) so
# every path already written in CLAUDE.md / TASKS.md ("src/models/schemas.py", etc.)
# stays literally correct — no renaming needed later.
packages = ["src"]

[tool.pytest.ini_options]
# Native pytest option (pytest>=7), no plugin needed — lets tests import e.g.
# `from models.schemas import Segment` without a `src.` prefix during development.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: hits a real ASR API, downloads/runs a real model, or needs a GPU — skipped by default (see CLAUDE.md Testing).",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
